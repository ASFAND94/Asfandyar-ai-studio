services:
  asfandyar-ai-studio:
    build: .
    container_name: asfandyar-ai-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      APP_DB_PATH: /data/asfandyar.db
      AUTH_DB_PATH: /data/asfandyar.db
      SOCIAL_DB_PATH: /data/asfandyar.db
      PORT: "8000"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    ports:
      - "8000:8000"
    volumes:
      - asfandyar_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  ollama:
    image: ollama/ollama:latest
    container_name: asfandyar-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
volumes:
  asfandyar_data:
  ollama_data:
